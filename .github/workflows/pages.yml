name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Playwright's own browser, matched to the pinned library version.
      - run: npx playwright install --with-deps chromium

      - run: npm test

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests run the tests above and stop there; only main publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    # Never let two deploys race; queue them instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The same script test/site.test.mjs stages with, so what CI tested above
      # is exactly what gets published here.
      - name: Stage the site
        run: ./scripts/stage-site.sh site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Best effort only. The Actions token can request Pages deployments
          # but usually cannot create the Pages site itself — that needs admin
          # rights, and this step fails with "Resource not accessible by
          # integration" until someone turns Pages on once under
          # Settings -> Pages -> Source: GitHub Actions. Left enabled so the
          # step is a no-op afterwards, and so it recovers on its own if Pages
          # is ever switched off in a repo where the token does have the rights.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
